spring.application.name=cashu-vault-jpa

# Production Database Configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cashu_vault}
spring.datasource.username=${DATABASE_USER:cashu}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HikariCP Connection Pool Configuration (Production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# Flyway configuration
spring.flyway.enabled=true
# db/migration is scanned recursively, so engine-specific migrations live outside
# it: {vendor} resolves to postgresql or h2, and the active-keyset constraint
# cannot be written portably because H2 has no partial indexes.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.baseline-on-migrate=true

# Hibernate Envers configuration for audit tables
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_a
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.audit_strategy=org.hibernate.envers.strategy.DefaultAuditStrategy

# Production Logging configuration
logging.level.org.hibernate.SQL=WARN
logging.level.xyz.tcheeric.cashu.vault=INFO
logging.level.com.zaxxer.hikari=INFO

# Port configuration
server.port=${cashu_vault_port:3333}
vault.base.url=${VAULT_BASE_URL:http://localhost:${server.port}/}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
