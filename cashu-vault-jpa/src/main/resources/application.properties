spring.application.name=cashu-vault-jpa
# Database configuration for H2
spring.datasource.url=jdbc:h2:file:./cashu_vault;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# Do NOT set spring.datasource.driver-class-name

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
# show-sql prints bound parameters, which for t_proof means the secret and C: spendable
# ecash in the application log (audit M-12). Off by default; turn it on deliberately and
# only against a database with no real proofs in it.
spring.jpa.show-sql=false
# Flyway configuration
spring.flyway.enabled=true
# db/migration is scanned recursively, so engine-specific migrations live outside
# it: {vendor} resolves to postgresql or h2, and the active-keyset constraint
# cannot be written portably because H2 has no partial indexes.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}
spring.flyway.baseline-on-migrate=true
# Hibernate Envers configuration for audit tables
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_a
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.audit_strategy=org.hibernate.envers.strategy.DefaultAuditStrategy
# Logging configuration
logging.level.org.hibernate.SQL=WARN
# DEBUG on this package prints proof and key entities. INFO by default (audit M-12).
logging.level.xyz.tcheeric.cashu.vault=INFO

# Port configuration
server.port=${cashu_vault_port:3333}
vault.base.url=http://localhost:${server.port}/
server.address=
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState

# Vault API authentication (audit C-2). No default: this service stores spendable proof secrets
# and keyset material, so a packaged default would be a published credential. Generate with:
#   openssl rand -hex 32
vault.api.token=${VAULT_API_TOKEN:}
# Optional read-only token (cashu-vault#154). May issue GET and HEAD only. Give this to monitoring
# and operator tooling rather than the mint's token. Must differ from vault.api.token.
vault.api.read-token=${VAULT_API_READ_TOKEN:}
