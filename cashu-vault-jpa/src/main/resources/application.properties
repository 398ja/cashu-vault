spring.application.name=cashu-vault-jpa
# Database configuration for H2
spring.datasource.url=jdbc:h2:file:./cashu_vault;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# Do NOT set spring.datasource.driver-class-name
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Hibernate Envers configuration for audit tables
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_a
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.audit_strategy=org.hibernate.envers.strategy.DefaultAuditStrategy
# Logging configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.xyz.tcheeric.cashu.vault=DEBUG

# Port configuration
server.port=${cashu_vault_port:3333}
vault.base.url=http://localhost:${server.port}/
server.address=
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState
