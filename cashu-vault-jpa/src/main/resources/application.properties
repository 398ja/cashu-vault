spring.application.name=cashu-vault-jpa
# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cashu_vault
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# JPA configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Logging configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.xyz.tcheeric.cashu.vault=DEBUG

# Port configuration
server.port=${cashu_vault_port:3333}
vault.base.url=http://localhost:${server.port}/
