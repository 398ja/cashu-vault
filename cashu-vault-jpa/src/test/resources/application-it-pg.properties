spring.application.name=cashu-vault-jpa-it
# DataSource wired via @ServiceConnection (PostgresIntegrationTest base class)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
logging.level.org.hibernate.SQL=WARN

# Security users for Testcontainers ITs.
# WARNING: dev/test credentials only — production credentials MUST come from env/Hashi.
cashu.vault.security.enabled=true
cashu.vault.security.users[0].username=admin
cashu.vault.security.users[0].password=admin-test
cashu.vault.security.users[0].roles[0]=ADMIN

cashu.vault.security.users[1].username=mint-alpha
cashu.vault.security.users[1].password=alpha-test
cashu.vault.security.users[1].roles[0]=SERVICE
cashu.vault.security.users[1].mintScope=11111111-1111-1111-1111-111111111111

cashu.vault.security.users[2].username=mint-bravo
cashu.vault.security.users[2].password=bravo-test
cashu.vault.security.users[2].roles[0]=SERVICE
cashu.vault.security.users[2].mintScope=22222222-2222-2222-2222-222222222222
