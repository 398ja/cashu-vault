spring.application.name=cashu-vault-jpa
# Database configuration - H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Hibernate configuration
# Test resources shadow the main application.properties of the same name, so the
# engine-specific migration location has to be repeated here or Flyway silently
# skips it and the schema differs from production.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# JPA configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Logging configuration
logging.level.org.hibernate.SQL=WARN

# Port configuration for tests
server.port=${cashu_vault_port:3333}
vault.base.url=https://localhost:${server.port}/

# Test token for the vault API. The service refuses to start without one (audit C-2).
# Controller tests authenticate with @WithMockUser rather than presenting this token, since they
# are about controller behaviour; VaultApiAuthenticationTest covers the auth boundary itself.
vault.api.token=test-vault-api-token
# Read-only token, for the credential-split tests in VaultApiAuthenticationTest.
vault.api.read-token=test-vault-read-token
