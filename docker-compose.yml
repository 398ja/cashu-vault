version: '3.8'
services:
  cashu-vault-db:
    image: postgres:16
    environment:
      POSTGRES_DB: cashu_vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  cashu-vault-jpa:
    build: ./cashu-vault-jpa
    depends_on:
      cashu-vault-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cashu-vault-db:5432/cashu_vault
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      cashu_vault_port: ${cashu_vault_port:-3333}
      VAULT_BASE_URL: http://localhost:${cashu_vault_port:-3333}
    ports:
      - "${cashu_vault_port:-3333}:${cashu_vault_port:-3333}"
