version: '3.8'
services:
  cashu-vault-db:
    image: postgres:16
    env_file: docker.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  hashicorp-vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    env_file: docker.env
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      hashicorp-vault:
        condition: service_healthy
    env_file: docker.env
    environment:
      VAULT_ADDR: http://hashicorp-vault:8200
    entrypoint: /bin/sh
    command:
      - -c
      - |
        export VAULT_TOKEN="$$VAULT_DEV_ROOT_TOKEN_ID"

        vault secrets enable -path=$$VAULT_HASHI_ENGINE_MOUNT kv-v2 || true

        vault policy write cashu-vault - <<EOF
        path "$${VAULT_HASHI_ENGINE_MOUNT}/data/keys/*" {
          capabilities = ["create", "read", "update"]
        }
        path "$${VAULT_HASHI_ENGINE_MOUNT}/metadata/keys/*" {
          capabilities = ["read", "list", "delete"]
        }
        path "$${VAULT_HASHI_ENGINE_MOUNT}/data/seeds/*" {
          capabilities = ["create", "read", "update"]
        }
        path "$${VAULT_HASHI_ENGINE_MOUNT}/metadata/seeds/*" {
          capabilities = ["read", "list"]
        }
        path "$${VAULT_HASHI_ENGINE_MOUNT}/delete/keys/*" {
          capabilities = ["update"]
        }
        path "$${VAULT_HASHI_ENGINE_MOUNT}/destroy/keys/*" {
          capabilities = ["update"]
        }
        path "$${VAULT_HASHI_ENGINE_MOUNT}/metadata/*" {
          capabilities = ["list"]
        }
        EOF

        vault auth enable approle || true

        vault write auth/approle/role/cashu-vault \
          token_policies="cashu-vault" \
          token_ttl=1h \
          token_max_ttl=4h \
          secret_id_ttl=720h \
          secret_id_num_uses=0

        ROLE_ID=$$(vault read -field=role_id auth/approle/role/cashu-vault/role-id)
        SECRET_ID=$$(vault write -f -field=secret_id auth/approle/role/cashu-vault/secret-id)

        echo "VAULT_ROLE_ID=$$ROLE_ID"
        echo "VAULT_SECRET_ID=$$SECRET_ID"

        echo "$$ROLE_ID" > /vault/file/role-id
        echo "$$SECRET_ID" > /vault/file/secret-id

        echo "Vault initialized with $${VAULT_HASHI_ENGINE_MOUNT} KV v2 engine and AppRole auth"
    volumes:
      - vault-data:/vault/file
    restart: "no"

  cashu-vault-jpa:
    build: ./cashu-vault-jpa
    depends_on:
      cashu-vault-db:
        condition: service_healthy
      hashicorp-vault:
        condition: service_healthy
    env_file: docker.env
    ports:
      - "3333:3333"

volumes:
  pgdata:
  vault-data:
